<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="panMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3d" />
      <stop offset="100%" stop-color="#1c1c1f" />
    </linearGradient>
    <linearGradient id="fishWell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#1f1f22" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="14" fill="url(#panMetal)" />
  <rect x="2" y="2" width="96" height="96" rx="14" fill="none" stroke="#4a4a4d" stroke-width="1.5" />

  <!-- fish-shaped indentation, carved into the pan (mirrored so the tail points right) -->
  <g transform="translate(100,0) scale(-1,1)">
    <path
      d="M50 24
         C 66 24 76 34 80 50
         C 76 66 66 76 50 76
         C 40 76 32 70 27 62
         L 18 68 L 22 50 L 18 32 L 27 38
         C 32 30 40 24 50 24 Z"
      fill="url(#fishWell)"
      stroke="#000000"
      stroke-opacity="0.5"
      stroke-width="1"
    />

    <!-- faint scale texture inside the well -->
    <path
      d="M42 40 C 48 44 48 56 42 60"
      fill="none"
      stroke="#3a3a3d"
      stroke-width="1"
      stroke-opacity="0.6"
    />
    <path
      d="M50 38 C 57 43 57 57 50 62"
      fill="none"
      stroke="#3a3a3d"
      stroke-width="1"
      stroke-opacity="0.5"
    />
  </g>

  <!-- glossy highlight, upper-left -->
  <rect x="2" y="2" width="96" height="40" rx="14" fill="url(#sheen)" />
</svg>
